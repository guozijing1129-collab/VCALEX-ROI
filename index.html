<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALEXAGI ROI MODEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

      /* Global Density Scale */
      html {
        font-size: 14px;
      }

      body {
        background-color: #000000;
        /* Deep Apple Dark Mode Background */
        background-image: radial-gradient(circle at 50% 0%, #1c1c1e 0%, #000000 100%);
        color: #f5f5f7; /* SF Text Color */
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        transition: background 0.5s ease, color 0.5s ease;
      }

      /* Apple-style Glassmorphism (Dark Default) */
      .apple-glass {
        background: rgba(28, 28, 30, 0.65);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.3);
        transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
      }

      .apple-glass-light {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: background 0.3s;
      }

      /* macOS Control Center Slider Logic */
      .macos-slider-track {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        transition: background 0.2s;
      }
      .macos-slider-track:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      
      /* Native Input Reset for Overlay */
      input[type=range].overlay-input {
        -webkit-appearance: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
        z-index: 20;
      }

      /* Custom Scrollbar (Minimalist) */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.4);
      }
      
      /* Aurora/Siri Gradient Animation */
      .siri-gradient {
        background: radial-gradient(circle at 0% 0%, rgba(0, 122, 255, 0.4), transparent 50%),
                    radial-gradient(circle at 100% 0%, rgba(175, 82, 222, 0.4), transparent 50%),
                    radial-gradient(circle at 100% 100%, rgba(255, 45, 85, 0.4), transparent 50%),
                    radial-gradient(circle at 0% 100%, rgba(52, 199, 89, 0.4), transparent 50%);
        filter: blur(40px);
        animation: aurora 15s infinite alternate;
      }
      
      @keyframes aurora {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.2); opacity: 0.8; }
      }

      /* --- Light Mode Overrides (High Contrast for Data) --- */
      body.light-mode {
        background-color: #f0f7ff; /* Very light blue tint */
        background-image: 
            radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
            radial-gradient(circle at 100% 100%, rgba(124, 58, 237, 0.08) 0%, transparent 40%);
        color: #0f172a; /* Slate 900 - Max Contrast */
      }

      body.light-mode .apple-glass {
        background: #ffffff;
        backdrop-filter: none;
        border: 1px solid #bfdbfe; /* Blue 200 */
        box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.1), 0 2px 6px -1px rgba(37, 99, 235, 0.05);
      }

      body.light-mode .apple-glass-light {
        background: #eff6ff; /* Blue 50 */
        border: 1px solid #dbeafe; /* Blue 100 */
      }

      /* Controls */
      body.light-mode .macos-slider-track {
        background: #e2e8f0; /* Slate 200 */
        border: 1px solid #cbd5e1;
      }
      body.light-mode .macos-slider-track:hover {
        background: #cbd5e1;
      }

      /* Typography Mappings (High Contrast) */
      body.light-mode .text-white { color: #0f172a !important; } /* Deep Slate / Black equivalent */
      body.light-mode .text-zinc-100 { color: #1e293b !important; } /* Slate 800 */
      body.light-mode .text-zinc-200 { color: #1e3a8a !important; } /* Blue 900 */
      body.light-mode .text-zinc-300 { color: #1d4ed8 !important; font-weight: 600; } /* Blue 700 */
      body.light-mode .text-zinc-400 { color: #334155 !important; font-weight: 600; } /* Slate 700 - Much Darker for readability */
      body.light-mode .text-zinc-500 { color: #64748b !important; font-weight: 500; } /* Slate 500 */
      body.light-mode .text-zinc-600 { color: #94a3b8 !important; } 
      
      /* SVG Fill Overrides for Charts/Gauges */
      body.light-mode .fill-white { fill: #0f172a !important; } /* Metric Numbers */
      body.light-mode .fill-zinc-400 { fill: #475569 !important; } /* Sub-labels */
      body.light-mode .text-zinc-800 { color: #e2e8f0 !important; } /* For background tracks in charts if using text class on SVG */

      /* Accent Colors - High Visibility */
      body.light-mode .text-emerald-400 { color: #059669 !important; font-weight: 700; } /* Emerald 600 */
      body.light-mode .text-blue-400 { color: #2563eb !important; font-weight: 700; } /* Blue 600 */
      body.light-mode .text-purple-400 { color: #7c3aed !important; font-weight: 700; } /* Purple 600 */
      body.light-mode .text-rose-400 { color: #dc2626 !important; font-weight: 700; } /* Red 600 */
      
      /* Component Overrides */
      body.light-mode .bg-black\/40 { 
        background-color: rgba(255, 255, 255, 0.95) !important;
        border-bottom: 1px solid #bfdbfe !important; 
        color: #0f172a !important;
      }
      body.light-mode .bg-black\/20 {
        background-color: #f8fafc !important; /* Slate 50 */
        border: 1px solid #e2e8f0 !important;
      }
      body.light-mode .bg-zinc-800\/50 {
        background-color: #ffffff !important;
        border: 1px solid #e2e8f0;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      }
      body.light-mode .bg-zinc-900\/40 {
         background-color: #f1f5f9 !important;
         border-top: 1px solid #e2e8f0 !important;
      }
      body.light-mode .bg-zinc-600 { 
        background-color: #2563eb !important; 
        color: #ffffff !important;
        box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3) !important;
      } 
      body.light-mode .bg-zinc-700\/50 {
        background-color: #e2e8f0 !important;
        color: #475569 !important;
      }

      /* Buttons */
      body.light-mode .bg-white { 
        background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%) !important; 
        color: #ffffff !important; 
        box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4);
        border: none !important;
      }
      /* Fix button text inside buttons that might get overridden by text-white rule */
      body.light-mode button .text-black { color: #ffffff !important; }
      
      body.light-mode .bg-white\/10 {
        background-color: #eff6ff !important;
        border: 1px solid #bfdbfe !important;
        color: #1e40af !important;
      }
      
      body.light-mode .border-white\/5 { border-color: #e2e8f0 !important; }
      body.light-mode .border-white\/10 { border-color: #cbd5e1 !important; }

      /* Chart Specifics */
      body.light-mode .recharts-cartesian-grid-horizontal line { stroke: #cbd5e1 !important; }
      body.light-mode .recharts-text { fill: #475569 !important; font-weight: 600; }

      /* Hide Aurora in Light Mode */
      body.light-mode .siri-gradient { display: none !important; }
      
      body.light-mode .bg-black { background-color: #dbeafe !important; } 

      /* --- PRINT STYLES (Enhanced for Tiled Export) --- */
      @media print {
        @page {
          size: landscape;
          margin: 0.8cm;
        }
        
        body, #root { 
          background: white !important; 
          background-image: none !important;
          color: black !important; 
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          height: auto !important;
          overflow: visible !important;
          font-size: 11px !important;
        }

        /* Force Expansion of all scroll containers */
        .h-screen, .h-\[100dvh\], .h-full, .overflow-y-auto, .overflow-hidden {
          height: auto !important;
          overflow: visible !important;
          max-height: none !important;
        }
        
        /* Layout Adjustments for Print - Maintain Row but allow wrapping/scaling */
        .flex-col.lg\:flex-row {
           display: flex !important;
           flex-direction: row !important;
           gap: 1.5rem !important;
        }

        /* Sidebar visibility */
        .lg\:w-\[320px\] {
          width: 280px !important; /* Fixed print width */
          flex-shrink: 0 !important;
        }

        /* Main Content visibility */
        .flex-1 {
          flex: 1 1 auto !important;
          display: block !important; /* Helps charts stack properly if needed */
        }
        
        /* Chart Grids */
        .lg\:grid {
           display: grid !important;
           grid-template-columns: repeat(3, 1fr) !important;
           gap: 1rem !important;
        }
        .lg\:flex-\[4\], .lg\:flex-\[2\.5\] {
           flex: none !important;
           width: 100% !important;
           margin-bottom: 1rem !important;
        }

        /* Hide Elements specifically marked for no-print */
        .no-print, header, button { 
          display: none !important; 
        }

        /* Show Elements specifically marked for print-only */
        .print-only {
          display: flex !important;
        }
        
        /* Styling overrides for Print Clarity */
        .apple-glass, .apple-glass-light { 
           background: #ffffff !important; 
           border: 1px solid #ccc !important; 
           box-shadow: none !important; 
           color: black !important; 
           backdrop-filter: none !important;
           page-break-inside: avoid;
        }
        
        /* Ensure text contrast in print */
        .text-white, .text-zinc-100, .text-zinc-200, .text-zinc-300, .text-zinc-400, .text-zinc-500, .text-zinc-600 {
          color: #111 !important;
        }
        .text-emerald-400 { color: #047857 !important; }
        .text-blue-400 { color: #1d4ed8 !important; }
        .text-purple-400 { color: #6d28d9 !important; }
        .text-rose-400 { color: #be123c !important; }
        
        /* Force Chart Colors */
        .recharts-cartesian-grid-horizontal line { stroke: #ddd !important; }
        .recharts-text { fill: #333 !important; font-size: 10px !important; }
        
        /* Hide scrollbars completely */
        ::-webkit-scrollbar { display: none !important; }
        
        /* Expand Logic Overrides */
        .max-h-0 {
           max-height: none !important;
           opacity: 1 !important;
           display: block !important;
        }
      }
      
      /* Watermark Pattern for Print */
      .watermark {
          display: none;
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          pointer-events: none;
          z-index: -1;
          opacity: 0.05;
          background-image: url('data:image/svg+xml;utf8,<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg"><text x="50%" y="50%" font-family="Arial" font-size="24" fill="black" transform="rotate(-45 200 200)" text-anchor="middle">VCALEXAGI ZENAVA</text></svg>');
      }
      @media print {
          .watermark { display: block; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
