<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALEXAGI客服价值ROI预估模型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom Scrollbar for Dark Theme */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
      
      body {
        background-color: #020617; /* Slate 950 */
        color: #e2e8f0;
        font-family: 'Inter', sans-serif;
        overflow: hidden; /* Prevent body scroll, handle inside app */
      }

      /* Custom Range Slider Styling */
      input[type=range] {
        -webkit-appearance: none; /* Hides the slider so that custom slider can be made */
        width: 100%; /* Specific width is required for Firefox. */
        background: transparent; /* Otherwise white in Chrome */
      }
      
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
        margin-top: -5px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
        transition: transform 0.1s;
      }
      
      input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
      }

      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: transparent; /* Handled by inline style in React */
        border-radius: 2px;
      }
      
      input[type=range]:focus {
        outline: none;
      }

      /* Print Styles for Exporting Report */
      @media print {
        @page {
          margin: 0.5cm;
          size: landscape;
        }
        body {
          background-color: #020617 !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
          overflow: visible;
        }
        .no-print {
          display: none !important;
        }
        /* Ensure grid layout works in print */
        .print\:col-span-12 {
          grid-column: span 12 / span 12 !important;
          width: 100% !important;
        }
        /* Adjust heights for static print */
        .h-screen {
          height: auto !important;
          overflow: visible !important;
        }
        .overflow-y-auto {
          overflow: visible !important;
        }
        /* Hide scrollbars in print */
        ::-webkit-scrollbar {
            display: none;
        }
      }
    </style>
  <script type="importmap">

}
</script>
