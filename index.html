<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALEXAGI ROI MODEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

      /* Global Density Scale */
      html {
        font-size: 14px;
      }

      body {
        background-color: #000000;
        /* Deep Apple Dark Mode Background */
        background-image: radial-gradient(circle at 50% 0%, #1c1c1e 0%, #000000 100%);
        color: #f5f5f7; /* SF Text Color */
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Apple-style Glassmorphism */
      .apple-glass {
        background: rgba(28, 28, 30, 0.65);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.3);
      }

      .apple-glass-light {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* macOS Control Center Slider Logic */
      .macos-slider-track {
        position: relative;
        overflow: hidden;
        border-radius: 8px; /* Squircle-ish */
        background: rgba(255, 255, 255, 0.1);
        transition: background 0.2s;
      }
      .macos-slider-track:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      
      /* Native Input Reset for Overlay */
      input[type=range].overlay-input {
        -webkit-appearance: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
        z-index: 20;
      }

      /* Custom Scrollbar (Minimalist) */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.4);
      }
      
      /* Aurora/Siri Gradient Animation */
      .siri-gradient {
        background: radial-gradient(circle at 0% 0%, rgba(0, 122, 255, 0.4), transparent 50%),
                    radial-gradient(circle at 100% 0%, rgba(175, 82, 222, 0.4), transparent 50%),
                    radial-gradient(circle at 100% 100%, rgba(255, 45, 85, 0.4), transparent 50%),
                    radial-gradient(circle at 0% 100%, rgba(52, 199, 89, 0.4), transparent 50%);
        filter: blur(40px);
        animation: aurora 15s infinite alternate;
      }
      
      @keyframes aurora {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.2); opacity: 0.8; }
      }

      /* Print Styles */
      @media print {
        body { background: white !important; color: black !important; }
        .apple-glass { background: white !important; border: 1px solid #ccc !important; box-shadow: none !important; color: black !important; }
        .no-print { display: none !important; }
        .text-white { color: black !important; }
        .text-slate-400 { color: #666 !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
