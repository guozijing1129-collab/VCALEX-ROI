<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALEXAGI客服价值ROI预估模型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;600;700&display=swap');

      /* Global Scale Down for Dashboard Density */
      html {
        font-size: 14px; /* Standard is 16px, reducing to 14px scales down all rem units by 12.5% */
      }

      /* Custom Scrollbar for Dark Theme */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #020617; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b; 
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b82f6; 
        box-shadow: 0 0 10px #3b82f6;
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 3px; /* Thinner scrollbar */
      }
      
      body {
        background-color: #000205; /* Deepest Black */
        color: #e2e8f0;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }

      /* Tech Background Grid */
      .bg-tech-grid {
        background-size: 50px 50px;
        background-image: 
          linear-gradient(to right, rgba(59, 130, 246, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
        mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      }

      .animate-scanline {
        animation: scanline 8s linear infinite;
      }

      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      /* Glowing Text Utility */
      .text-glow {
        text-shadow: 0 0 10px currentColor;
      }

      /* Custom Range Slider Styling */
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 10px; /* Smaller thumb */
        width: 10px;
        border-radius: 2px; /* Square/Tech look */
        background: #ffffff;
        cursor: pointer;
        margin-top: -3px;
        box-shadow: 0 0 8px rgba(255,255,255,0.8), 0 0 15px currentColor;
        transition: transform 0.1s;
        border: 1px solid rgba(0,0,0,0.5);
        transform-origin: center;
      }
      
      input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.3);
      }
      
      input[type=range]:active::-webkit-slider-thumb {
        transform: scale(1.1);
      }

      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 3px; /* Thinner track */
        cursor: pointer;
        background: transparent;
      }
      
      input[type=range]:focus {
        outline: none;
      }

      /* HUD Card Corners */
      .hud-card {
        position: relative;
        background: rgba(2, 6, 23, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(59, 130, 246, 0.15);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }
      
      .hud-card::before, .hud-card::after {
        content: '';
        position: absolute;
        width: 6px;
        height: 6px;
        border: 1px solid rgba(59, 130, 246, 0.5);
        transition: all 0.3s ease;
      }
      .hud-card::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
      .hud-card::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
      
      .hud-card:hover::before, .hud-card:hover::after {
        width: 100%;
        height: 100%;
        border-color: rgba(59, 130, 246, 0.3);
        opacity: 0.5;
      }

      /* Print Styles */
      @media print {
        @page { margin: 0.5cm; size: landscape; }
        body { background-color: #fff !important; color: #000 !important; -webkit-print-color-adjust: exact; overflow: visible; }
        .no-print { display: none !important; }
        .bg-tech-grid { display: none; }
        .hud-card { background: #fff !important; color: #000 !important; border: 1px solid #ddd !important; box-shadow: none !important; }
        .hud-card::before, .hud-card::after { display: none; }
        .text-white { color: #000 !important; }
        .text-slate-400 { color: #666 !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
